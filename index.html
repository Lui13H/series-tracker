<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTrack - Maratona do Luis e do Samuel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090c14',
                        cardBg: '#0f1422',
                        cardHover: '#16203a',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="glass-panel border-x-0 border-t-0 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-15 flex items-center justify-between" style="height:60px">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-600/40">
                    <i class="fa-solid fa-play text-white" style="font-size:13px;margin-left:1px"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-tight bg-gradient-to-r from-white to-indigo-300 bg-clip-text text-transparent" style="letter-spacing:-0.02em">StreamTrack</h1>
                    <p class="text-[10px] text-slate-600 uppercase tracking-widest" style="margin-top:1px">Cronograma de Maratona</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="handleResetAllProgress()" class="text-[11px] px-3 py-2 rounded-lg bg-white/[0.04] hover:bg-red-950/40 hover:text-red-400 text-slate-500 transition border border-white/[0.07] flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-right text-[10px]"></i> Resetar
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-8">

        <!-- Top Navigation Tabs: Luis vs Samuel -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="main-tabs">
            <!-- Rendered via JS -->
        </div>

        <!-- Sub-route selector for Luis (Rota 1 vs Rota 2) -->
        <div id="luis-subtabs-container" class="hidden">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                <span class="text-[10px] font-semibold text-slate-600 uppercase tracking-widest flex items-center gap-1.5">
                    <i class="fa-solid fa-code-fork opacity-60"></i> Escolha a rota
                </span>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="switchLuisRoute('rota1')" id="btn-rota1" class="pill-btn flex-1 sm:flex-none border pill-inactive">
                        Rota 1 — Death Note → CSM → HxH
                    </button>
                    <button onclick="switchLuisRoute('rota2')" id="btn-rota2" class="pill-btn flex-1 sm:flex-none border pill-inactive">
                        Rota 2 — HxH → CSM → Death Note
                    </button>
                </div>
            </div>
        </div>

        <!-- Sub-route selector for Samuel (Rota 1 vs Rota 2) -->
        <div id="samuel-subtabs-container" class="hidden">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                <span class="text-[10px] font-semibold text-slate-600 uppercase tracking-widest flex items-center gap-1.5">
                    <i class="fa-solid fa-hat-cowboy opacity-60"></i> Escolha a rota
                </span>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="switchSamuelRoute('rota1')" id="btn-samuel-rota1" class="pill-btn flex-1 sm:flex-none border pill-inactive">
                        Rota 1 — Breaking Bad + El Camino
                    </button>
                    <button onclick="switchSamuelRoute('rota2')" id="btn-samuel-rota2" class="pill-btn flex-1 sm:flex-none border pill-inactive">
                        Rota 2 — BB + El Camino + BCS
                    </button>
                </div>
            </div>
        </div>

        <!-- Dashboard / Overview Stats -->
        <section class="glass-panel rounded-2xl px-6 py-5 shadow-2xl">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-5">
                <!-- Title + Desc -->
                <div class="min-w-0">
                    <h2 id="current-title" class="text-lg font-semibold text-white truncate" style="letter-spacing:-0.02em">Carregando...</h2>
                    <p id="current-desc" class="text-[11px] text-slate-600 mt-0.5">Acompanhe seu progresso episódio por episódio.</p>
                </div>
                <!-- Stats strip -->
                <div class="flex items-center gap-0 shrink-0">
                    <!-- Hero: percent -->
                    <div class="pr-5 border-r border-white/[0.07]">
                        <span id="stat-percent" class="stat-num text-3xl font-bold text-indigo-400">0%</span>
                        <span class="block text-[9px] text-slate-600 uppercase tracking-widest mt-1">Progresso</span>
                    </div>
                    <!-- Time stats -->
                    <div class="flex items-center gap-5 pl-5">
                        <div>
                            <span id="stat-watched" class="stat-num text-sm font-bold text-emerald-400 block">0h</span>
                            <span class="text-[9px] text-slate-600 uppercase tracking-widest mt-0.5 block">Assistido</span>
                        </div>
                        <div>
                            <span id="stat-remaining" class="stat-num text-sm font-bold text-amber-400 block">0h</span>
                            <span class="text-[9px] text-slate-600 uppercase tracking-widest mt-0.5 block">Falta</span>
                        </div>
                        <div>
                            <span id="stat-total" class="stat-num text-sm font-bold text-slate-400 block">0h</span>
                            <span class="text-[9px] text-slate-600 uppercase tracking-widest mt-0.5 block">Total</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="mt-5 w-full progress-track">
                <div id="progress-bar-fill" class="progress-fill" style="width: 0%"></div>
            </div>
        </section>

        <!-- Arcs and Episodes Section -->
        <div id="arcs-container" class="space-y-0">
            <!-- Rendered via JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/[0.05] py-6 text-center text-xs text-slate-700 mt-auto">
        <p>StreamTrack &copy; 2026 - Rotas do Luis e do Samuel salvas no seu navegador.</p>
    </footer>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-white/[0.06] text-white px-4 py-3 rounded-xl shadow-2xl border border-white/[0.1] flex items-center space-x-3 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Progresso atualizado com sucesso!</span>
    </div>

    <!-- External Scripts (in order) -->
    <script src="js/data/episodes.js"></script>
    <script src="js/state/progress.js"></script>
    <script src="js/utils/time.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/ui/routes.js"></script>
    <script src="js/ui/render.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
